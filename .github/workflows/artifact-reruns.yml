name: Artifact rerun and recovery comparison
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions: {}
concurrency:
  group: artifact-reruns
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: >-
      github.repository == 'tetsujisugimori-coder/github-actions-reliability-lab' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/artifact-reruns' &&
      ((github.event.label.name == 'run-rerun-baseline' && github.run_attempt == '1') ||
      (github.event.label.name == 'run-rerun-experiment' && fromJSON(github.run_attempt) <= 6))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      build-name: ${{ steps.name.outputs.value }}
      build-id: ${{ steps.build.outputs.artifact-id }}
      build-digest: ${{ steps.build.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 experiments/artifacts.py negative
      - run: python3 experiments/artifacts.py validate
      - id: name
        run: echo "value=lab-validated-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.value }}
          path: payload
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  combined:
    name: ${{ matrix.mode }} Prepare and Deploy
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        mode: [A, B]
    if: >-
      github.repository == 'tetsujisugimori-coder/github-actions-reliability-lab' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/artifact-reruns' &&
      ((github.event.label.name == 'run-rerun-baseline' && github.run_attempt == '1') ||
      (github.event.label.name == 'run-rerun-experiment' && fromJSON(github.run_attempt) <= 6))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        id: prepare
        with:
          build-name: ${{ needs.validate.outputs.build-name }}
          build-id: ${{ needs.validate.outputs.build-id }}
          build-digest: ${{ needs.validate.outputs.build-digest }}
          pages-name: ${{ format('lab-{0}-{1}-{2}', matrix.mode == 'A' && 'a' || 'b', github.run_id, github.run_attempt) }}
          token: ${{ github.token }}
      - name: Check prepared artifact
        env:
          PAGES_NAME: ${{ steps.prepare.outputs.pages-name }}
          PAGES_ID: ${{ steps.prepare.outputs.pages-id }}
          PAGES_DIGEST: ${{ steps.prepare.outputs.pages-digest }}
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/artifacts.py check PAGES
      - name: Inspect previous publication jobs
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_JOB: ${{ format('{0} Prepare and Deploy', matrix.mode) }}
        run: python3 experiments/artifacts.py history
      - name: Observe internal artifact listing
        if: ${{ matrix.mode == 'A' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: internal-view
      - name: Resolve same name through internal artifact service
        if: ${{ matrix.mode == 'A' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.prepare.outputs.pages-name }}
          path: by-name
      - name: Inject pre-send failure in attempt 1
        if: github.event.label.name == 'run-rerun-experiment' && github.run_attempt == '1'
        run: exit 24
      - name: Report stopped repeat
        if: steps.history.outputs.entered == 'true'
        run: echo 'BLOCKED_PREVIOUS_PUBLICATION'
      - name: Simulate publication
        if: steps.history.outputs.entered == 'false'
        env:
          PAGES_ID: ${{ steps.prepare.outputs.pages-id }}
          PAGES_NAME: ${{ steps.prepare.outputs.pages-name }}
        run: printf 'MOCK_PUBLICATION id=%s name=%s\\n' "$PAGES_ID" "$PAGES_NAME"

  prepare:
    name: C Prepare Pages
    needs: validate
    if: >-
      github.repository == 'tetsujisugimori-coder/github-actions-reliability-lab' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/artifact-reruns' &&
      ((github.event.label.name == 'run-rerun-baseline' && github.run_attempt == '1') ||
      (github.event.label.name == 'run-rerun-experiment' && fromJSON(github.run_attempt) <= 6))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      pages-name: ${{ steps.prepare.outputs.pages-name }}
      pages-id: ${{ steps.prepare.outputs.pages-id }}
      pages-digest: ${{ steps.prepare.outputs.pages-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        id: prepare
        with:
          build-name: ${{ needs.validate.outputs.build-name }}
          build-id: ${{ needs.validate.outputs.build-id }}
          build-digest: ${{ needs.validate.outputs.build-digest }}
          pages-name: ${{ format('lab-{0}-{1}-{2}', 'c', github.run_id, github.run_attempt) }}
          token: ${{ github.token }}

  publish:
    name: C Deploy
    needs: prepare
    if: >-
      github.repository == 'tetsujisugimori-coder/github-actions-reliability-lab' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'experiment/artifact-reruns' &&
      ((github.event.label.name == 'run-rerun-baseline' && github.run_attempt == '1') ||
      (github.event.label.name == 'run-rerun-experiment' && fromJSON(github.run_attempt) <= 6))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check prepared artifact
        env:
          PAGES_NAME: ${{ needs.prepare.outputs.pages-name }}
          PAGES_ID: ${{ needs.prepare.outputs.pages-id }}
          PAGES_DIGEST: ${{ needs.prepare.outputs.pages-digest }}
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/artifacts.py check PAGES
      - name: Inspect previous publication jobs
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_JOB: ${{ 'C Deploy' }}
        run: python3 experiments/artifacts.py history
      - name: Observe internal artifact listing
        if: ${{ true }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: internal-view
      - name: Resolve same name through internal artifact service
        if: ${{ true }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.pages-name }}
          path: by-name
      - name: Inject pre-send failure in attempt 1
        if: github.event.label.name == 'run-rerun-experiment' && github.run_attempt == '1'
        run: exit 24
      - name: Report stopped repeat
        if: steps.history.outputs.entered == 'true'
        run: echo 'BLOCKED_PREVIOUS_PUBLICATION'
      - name: Simulate publication
        if: steps.history.outputs.entered == 'false'
        env:
          PAGES_ID: ${{ needs.prepare.outputs.pages-id }}
          PAGES_NAME: ${{ needs.prepare.outputs.pages-name }}
        run: printf 'MOCK_PUBLICATION id=%s name=%s\\n' "$PAGES_ID" "$PAGES_NAME"
